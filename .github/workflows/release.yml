name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: HRM System v${{ steps.get_version.outputs.version }}
          body: |
            ## HRM System v${{ steps.get_version.outputs.version }}

            Production release for New Lanka Clothing (Pvt) Ltd.

            ### Included
            - Desktop app bundles for Windows and Linux
            - Auto-update metadata (`latest.json`)

            ### Notes
            - Release documentation files are intentionally excluded in production repositories.
            - See commit history for detailed change tracking.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles appimage'
          - platform: windows-latest
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Create .env file from secrets
        shell: bash
        run: |
          echo "VITE_FB_API_KEY=${{ secrets.VITE_FB_API_KEY }}" >> .env
          echo "VITE_FB_AUTH_DOMAIN=${{ secrets.VITE_FB_AUTH_DOMAIN }}" >> .env
          echo "VITE_FB_PROJECT_ID=${{ secrets.VITE_FB_PROJECT_ID }}" >> .env
          echo "VITE_FB_STORAGE_BUCKET=${{ secrets.VITE_FB_STORAGE_BUCKET }}" >> .env
          echo "VITE_FB_MESSAGING_SENDER_ID=${{ secrets.VITE_FB_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FB_APP_ID=${{ secrets.VITE_FB_APP_ID }}" >> .env
          echo "VITE_FB_COMPANY_ID=${{ secrets.VITE_FB_COMPANY_ID }}" >> .env

      - name: Prepare Tauri signing key
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${RAW_SIGNING_KEY:-}" ]; then
            echo "Error: TAURI_SIGNING_PRIVATE_KEY is empty or missing."
            exit 1
          fi

          normalize_key() {
            printf '%b' "$1" | tr -d '\r'
          }

          looks_like_minisign_secret() {
            local key="$1"
            printf '%s' "$key" | grep -q '^untrusted comment: .*secret key'
          }

          KEY_NORMALIZED="$(normalize_key "$RAW_SIGNING_KEY")"

          if looks_like_minisign_secret "$KEY_NORMALIZED"; then
            KEY_BASE64="$(printf '%s' "$KEY_NORMALIZED" | base64 | tr -d '\r\n')"
          else
            KEY_BASE64="$(printf '%s' "$RAW_SIGNING_KEY" | tr -d ' \t\r\n')"
          fi

          KEY_DECODED="$(printf '%s' "$KEY_BASE64" | base64 --decode 2>/dev/null || true)"
          KEY_DECODED="$(normalize_key "$KEY_DECODED")"

          if ! looks_like_minisign_secret "$KEY_DECODED"; then
            echo "Error: TAURI_SIGNING_PRIVATE_KEY is not a valid minisign secret key."
            echo "Expected first line like: untrusted comment: minisign encrypted secret key"
            echo "Tip: paste the full key file contents (with real newlines) or a clean base64 string."
            exit 1
          fi

          PASSWORD_VALUE="${RAW_SIGNING_PASSWORD:-}"
          if [ -n "$PASSWORD_VALUE" ] && [ -z "$(printf '%s' "$PASSWORD_VALUE" | tr -d '[:space:]')" ]; then
            PASSWORD_VALUE=""
          fi

          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_BASE64"
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH="
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PASSWORD_VALUE"
          } >> "$GITHUB_ENV"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  update-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: v${{ steps.get_version.outputs.version }}
          fileName: '*'
          out-file-path: 'release-assets'

      - name: Generate latest.json for updater
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          
          # Find the signature files and bundles
          cd release-assets
          
          # Debug: List all files
          echo "Available files:"
          ls -la
          
          # Get Windows signature (prefer NSIS zip, then MSI zip, then exe)
          WIN_SIG=""
          WIN_URL=""
          # Check for NSIS zip bundle (updater format)
          if [ -f "HRM.System_${VERSION}_x64-setup.nsis.zip.sig" ]; then
            WIN_SIG=$(cat "HRM.System_${VERSION}_x64-setup.nsis.zip.sig")
            WIN_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/HRM.System_${VERSION}_x64-setup.nsis.zip"
          # Check for MSI zip bundle (updater format)
          elif [ -f "HRM.System_${VERSION}_x64_en-US.msi.zip.sig" ]; then
            WIN_SIG=$(cat "HRM.System_${VERSION}_x64_en-US.msi.zip.sig")
            WIN_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/HRM.System_${VERSION}_x64_en-US.msi.zip"
          # Fallback: Use exe signature (not ideal for updater but indicates signing works)
          elif [ -f "HRM.System_${VERSION}_x64-setup.exe.sig" ]; then
            echo "Warning: Only .exe.sig found, updater needs .nsis.zip or .msi.zip bundles"
            WIN_SIG=$(cat "HRM.System_${VERSION}_x64-setup.exe.sig")
            WIN_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/HRM.System_${VERSION}_x64-setup.exe"
          fi
          
          # Get Linux signature (prefer tar.gz bundle, then raw AppImage)
          LINUX_SIG=""
          LINUX_URL=""
          # Check for AppImage tar.gz bundle (updater format)
          if [ -f "HRM.System_${VERSION}_amd64.AppImage.tar.gz.sig" ]; then
            LINUX_SIG=$(cat "HRM.System_${VERSION}_amd64.AppImage.tar.gz.sig")
            LINUX_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/HRM.System_${VERSION}_amd64.AppImage.tar.gz"
          # Fallback: Use raw AppImage signature
          elif [ -f "HRM.System_${VERSION}_amd64.AppImage.sig" ]; then
            echo "Warning: Only .AppImage.sig found, updater needs .AppImage.tar.gz bundles"
            LINUX_SIG=$(cat "HRM.System_${VERSION}_amd64.AppImage.sig")
            LINUX_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/HRM.System_${VERSION}_amd64.AppImage"
          fi
          
          echo "Windows signature: ${WIN_SIG:0:50}..."
          echo "Windows URL: $WIN_URL"
          echo "Linux signature: ${LINUX_SIG:0:50}..."
          echo "Linux URL: $LINUX_URL"
          
          cd ..
          
          # Create latest.json
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See the release notes on GitHub",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${WIN_URL}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${LINUX_URL}"
              }
            }
          }
          EOF

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
